    <h1>⛄ Muñeco de nieve</h1>
    <p>
      Adaptación del proyecto <em>Super Snowman</em> de Khan Academy.
    </p>

    <div class="sketch-container" id="sketch-holder"></div>
  </main>

  <footer>
    <p>Adaptación de proyecto Khan Academy · Código nativo con p5.js</p>
  </footer>

  <script>
    function setup() {
      let canvas = createCanvas(400, 400);
      canvas.parent('sketch-holder');
      noLoop();
    }

    function draw() {
      background(20, 30, 60);

      noStroke();
      fill(255, 255, 200);
      for (let i = 0; i < 40; i++) {
        ellipse(random(400), random(250), random(1, 3), random(1, 3));
      }

      fill(250, 250, 220);
      ellipse(340, 60, 50, 50);
      fill(20, 30, 60);
      ellipse(325, 55, 40, 40);

      fill(240, 245, 255);
      rect(0, 320, 400, 80);
      fill(230, 235, 250);
      ellipse(100, 340, 200, 60);
      ellipse(300, 350, 250, 50);

      fill(180, 190, 210, 80);
      ellipse(200, 345, 150, 25);

      stroke(200);
      strokeWeight(1);
      fill(255);
      ellipse(200, 300, 140, 140);
      ellipse(200, 205, 105, 105);
      ellipse(200, 120, 75, 75);

      noStroke();
      fill(20);
      ellipse(185, 110, 12, 12);
      ellipse(215, 110, 12, 12);
      fill(255);
      ellipse(183, 108, 4, 4);
      ellipse(213, 108, 4, 4);

      fill(255, 130, 0);
      triangle(200, 120, 200, 138, 165, 130);

      noFill();
      stroke(20);
      strokeWeight(2);
      arc(200, 135, 30, 20, 0, PI);

      noStroke();
      fill(30, 25, 25);
      rect(155, 78, 90, 12, 3);
      rect(170, 30, 60, 55, 4);
      fill(180, 40, 40);
      rect(170, 65, 60, 10);

      strokeWeight(14);
      stroke(180, 50, 80);
      noFill();
      arc(200, 160, 70, 40, PI * 0.1, PI * 0.9);
      strokeWeight(12);
      line(230, 170, 245, 230);
      line(245, 230, 255, 225);
      strokeWeight(3);
      line(245, 230, 240, 245);
      line(245, 230, 250, 245);
      line(245, 230, 255, 242);

      noStroke();
      fill(20);
      ellipse(200, 185, 14, 14);
      ellipse(200, 215, 14, 14);
      ellipse(200, 245, 14, 14);

      stroke(90, 55, 30);
      strokeWeight(5);
      line(150, 195, 80, 150);
      line(80, 150, 65, 140);
      line(80, 150, 70, 135);
      line(250, 195, 320, 155);
      line(320, 155, 335, 145);
      line(320, 155, 330, 140);

      noStroke();
      fill(255, 255, 255, 180);
      for (let i = 0; i < 25; i++) {
        ellipse(random(400), random(320), random(2, 5), random(2, 5));
      }
    }
  </script>
