  </footer>

  <script>
    function setup() {
      let canvas = createCanvas(400, 400);
      canvas.parent('sketch-holder');
      noLoop();
    }

    function draw() {
      background(186, 145, 20); // wooden table
      ellipse(200, 200, 350, 350); // plate
      ellipse(200, 200, 300, 300);

      // Huevo estrellado
      fill(255, 255, 255); // clara
      ellipse(160, 180, 80, 80);
      fill(255, 200, 0); // yema
      ellipse(160, 180, 35, 35);

      // Trozo de carne
      fill(120, 60, 20);
      rect(210, 150, 90, 60, 10);

      // Guarnición de verduras (chícharos)
      fill(50, 180, 50);
      ellipse(180, 240, 20, 20);
      ellipse(200, 245, 18, 18);
      ellipse(190, 260, 22, 22);
      ellipse(200, 275, 19, 19);
      ellipse(170, 270, 20, 20);
    }
  </script>
